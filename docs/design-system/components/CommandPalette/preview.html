<!-- @dsCard group="Overlays" height=400 subtitle="⌘K: actions, tabs, history in one list" -->
<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>CommandPalette</title></head>
<body>
<div class="zt-stage" style="background:var(--bg-void);padding:24px;justify-content:center">
  <div class="zt-cmd" role="dialog" aria-label="Command Center">
    <div class="zt-cmd-in"><span class="ket">|</span><span class="q">podzi<span class="ph">ał…</span></span><span class="zt-loader" aria-label="Szukam"><i></i><i></i><i></i></span></div>
    <div class="zt-cmd-list">
      <div class="zt-eyebrow">Akcje</div>
      <div class="zt-row sel"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M8 3v10"/></svg></span><span class="lead">Otwórz kartę w podziale</span><span class="sub"></span><span class="zt-keys"><kbd class="zt-kbd">⌘</kbd><kbd class="zt-kbd">⇧</kbd><kbd class="zt-kbd">D</kbd></span></div>
      <div class="zt-row"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M8 3v10"/></svg></span><span class="lead">Zamień strony podziału</span><span class="sub"></span></div>
      <div class="zt-eyebrow">Historia</div>
      <div class="zt-row"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg></span><span class="lead">Podział ekranu — przewodnik</span><span class="sub">zitter.app/docs/split-view</span></div>
    </div>
    <div class="zt-cmd-foot"><span><kbd class="zt-kbd">↑</kbd><kbd class="zt-kbd">↓</kbd> wybierz</span><span><kbd class="zt-kbd">↵</kbd> otwórz</span><span><kbd class="zt-kbd">esc</kbd> zamknij</span></div>
  </div>
</div>
</body>
</html>
