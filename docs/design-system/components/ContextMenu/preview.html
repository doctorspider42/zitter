<!-- @dsCard group="Overlays" height=300 subtitle="Tab menu with shortcuts and a destructive end" -->
<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>ContextMenu</title></head>
<body>
<div class="zt-stage" style="background:var(--bg-void)">
  <div class="zt-menu" role="menu">
    <div class="zt-row sel" role="menuitem"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M8 3v10"/></svg></span><span class="lead">Otwórz w podziale</span></div>
    <div class="zt-row" role="menuitem"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5h4l-.5 4 2 2h-7l2-2zM8 8.5V14"/></svg></span><span class="lead">Przypnij kartę</span></div>
    <div class="zt-row" role="menuitem"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M3 10.5V4a1.5 1.5 0 0 1 1.5-1.5H10"/></svg></span><span class="lead">Kopiuj adres</span><span class="zt-keys"><kbd class="zt-kbd">⌘⇧C</kbd></span></div>
    <div class="zt-row" role="menuitem"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg></span><span class="lead">Zapisz stronę</span><span class="zt-keys"><kbd class="zt-kbd">⌘S</kbd></span></div>
    <hr>
    <div class="zt-row danger" role="menuitem"><span class="ico"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg></span><span class="lead">Zamknij kartę</span><span class="zt-keys"><kbd class="zt-kbd">⌘W</kbd></span></div>
  </div>
</div>
</body>
</html>
