<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>IconButton</title></head>
<body>
<div class="zt-stage">
  <button class="zt-iconbtn" aria-label="Wstecz"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
  <button class="zt-iconbtn" aria-label="Dalej" disabled><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
  <button class="zt-iconbtn" aria-label="Odśwież"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg></button>
  <span style="width:12px"></span>
  <button class="zt-iconbtn on" aria-label="Pasek boczny" aria-pressed="true"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M6.5 3v10"/></svg></button>
  <button class="zt-iconbtn" aria-label="Podział"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M8 3v10"/></svg></button>
  <button class="zt-iconbtn" aria-label="Nowa karta"><svg class="zt-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
</div>
</body>
</html>
