<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zitter</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-base); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; }
  .ket { fill:var(--ket); }
  .zing { fill:var(--zing); }
  .soft { fill:var(--ket-soft); }
  .blk { rx:var(--radius-md); }
  .dot { fill:var(--ket); rx:2px; }
  .bar { fill:var(--on-ket); rx:4px; }
  .zbar { fill:var(--on-zing); rx:4px; }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:120px; line-height:.92; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">

  pattern     tremor dots: "Zitterbewegung, the trembling" gives a dot grid at space-4 pitch, each dot nudged ±2px (space-0-5); one pill in on-ket on the slab echoes the | of the ket; two on-zing pills on the lime block read as a page card's first lines
  scales      pitch space-4, nudge space-0-5, gutters space-4; corners radius-md; dots and pills rx = half their 8px height
