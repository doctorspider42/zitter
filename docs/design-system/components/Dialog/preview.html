<!-- @dsCard group="Overlays" height=320 subtitle="Destructive confirmation over the scrim" -->
<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="zt-scrim" style="min-height:320px;box-sizing:border-box">
  <div class="zt-dialog" role="alertdialog" aria-labelledby="dt" aria-describedby="dd">
    <h2 id="dt">Zamknąć 12 kart?</h2>
    <p id="dd">Karty z obszaru „Praca” znikną z paska. Przypięte zostaną. Możesz je przywrócić skrótem ⌘⇧T.</p>
    <div class="zt-field"><span class="lbl">Nie pytaj ponownie<span class="hint">Dotyczy tylko tego obszaru</span></span><button class="zt-toggle" role="switch" aria-checked="false" aria-label="Nie pytaj ponownie" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')!=='true')"></button></div>
    <div class="foot"><button class="zt-btn zt-btn-quiet">Anuluj</button><button class="zt-btn zt-btn-danger strong">Zamknij karty</button></div>
  </div>
</div>
</body>
</html>
