<!-- @dsCard group="Inputs" height=160 subtitle="In a settings row, on and off" -->
<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Toggle</title></head>
<body>
<div class="zt-stage col" style="max-width:420px">
  <div class="zt-field"><span class="lbl">Blokuj elementy śledzące<span class="hint">Na wszystkich stronach, poza wyjątkami</span></span><button class="zt-toggle" role="switch" aria-checked="true" aria-label="Blokuj elementy śledzące" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')!=='true')"></button></div>
  <div class="zt-field"><span class="lbl">Odtwarzaj dźwięk w tle<span class="hint">Karta grająca pokazuje głośnik</span></span><button class="zt-toggle" role="switch" aria-checked="false" aria-label="Odtwarzaj dźwięk w tle" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')!=='true')"></button></div>
</div>
</body>
</html>
