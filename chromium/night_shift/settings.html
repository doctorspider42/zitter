<!doctype html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Night Shift settings</title>
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="settings.js"></script>
</head>
<body>

        <h1>Night Shift</h1>

    </main>
