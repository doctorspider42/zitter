<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Zitter app icon: the Dirac ket |z⟩ ("E1 Klasyczny" from the design canvas).
       macOS grid: 824 px body centred on a 1024 px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2C2652"/>
      <stop offset="0.48" stop-color="#14121E"/>
      <stop offset="1" stop-color="#08070C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#8B83FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B83FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(100 100) scale(8.24)">
      <rect width="100" height="100" rx="22.5" fill="url(#bg)"/>
      <rect width="100" height="100" rx="22.5" fill="url(#glow)"/>
      <rect width="100" height="48" rx="22.5" fill="url(#sheen)"/>
      <rect x="0.3" y="0.3" width="99.4" height="99.4" rx="22.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.6"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M27 28 V72" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.4"/>
        <path d="M39 38 H60 L39 62 H60" stroke="#FFFFFF" stroke-width="5"/>
        <path d="M67 28 L77 50 L67 72" stroke="#8B83FF" stroke-width="3.4"/>
      </g>
    </g>
  </g>
</svg>
