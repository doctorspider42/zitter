<!doctype html>
<meta charset="utf-8">
<title>Zitter performance probe</title>
<style>
  body { margin: 24px; background: #edf2f7; color: #152238; font: 18px system-ui; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  article { padding: 20px; background: white; border-radius: 12px; }
</style>
<h1>Zitter performance probe</h1>
<p>A local page with no external resources, fonts or animations.</p>
<main></main>
<script>
  for (let i = 0; i < 60; ++i) {
    const card = document.createElement('article');
    card.textContent = `Card ${i + 1}: a deterministic layout and paint workload.`;
    document.querySelector('main').append(card);
  }
</script>
<script>
  // Benchmark-only viewport witness: lets the external observer reject a new
  // sidebar frame paired with a stale WebContents size during native resize.
  const witness = document.createElement('div');
  witness.style.cssText = 'position:fixed;left:4px;top:4px;height:4px;display:flex;z-index:2147483647;pointer-events:none';
  const bits = Array.from({length:27}, () => {
    const bit = document.createElement('i'); bit.style.cssText = 'width:4px;height:4px;flex:none';
    witness.appendChild(bit); return bit;
  });
  document.body.appendChild(witness);
  function viewportWitness() {
    const code = (0x5aa5 << 11) | innerWidth;
    bits.forEach((bit, i) => bit.style.background = (code & (1 << (26-i))) ? '#eee' : '#111');
  }
  addEventListener('resize', viewportWitness);
  viewportWitness();
</script>
